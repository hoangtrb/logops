[project]
name = "logops"
version = "0.1.0"
description = "Logistics Ops Optimizer: fleet data to cost-saving decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "typer>=0.12",
]

[project.scripts]
logops = "logops.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the real Kaggle dataset in dataset/"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]  # docs hold illustrative snippets, not code to format

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
