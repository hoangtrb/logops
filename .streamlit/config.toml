[theme]
base = "light"
primaryColor = "#0f5257"
backgroundColor = "#f6f5f1"
secondaryBackgroundColor = "#ecebe5"
textColor = "#1f1e1c"
borderColor = "#e3e1da"
font = "sans serif"
baseRadius = "10px"
headingFontSizes = ["1.85rem", "1.25rem", "1.1rem"]
headingFontWeights = [700, 650, 650]

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f2ee"

[client]
toolbarMode = "viewer"

[server]
headless = true

[browser]
gatherUsageStats = false
